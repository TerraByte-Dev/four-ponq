<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Four Player Pong</title>
  </head>
  <body>
    <main id="app">
      <section id="game-shell" aria-label="Four Player Pong game">
        <div id="hud" aria-live="polite">
          <div class="score-strip" id="score-strip"></div>
          <div class="status-chip" id="status-chip">Circular 4 Player is ready.</div>
        </div>
        <div id="game-root"></div>
        <!-- The unified menu/lobby panel (#session-overlay) is injected by
             src/main.ts and serves as BOTH the load-in lobby and the M-menu. -->
        <button id="pause-button" type="button" aria-label="Pause or resume game">Pause</button>
        <div id="controls-panel">
          <span><strong>P1</strong> A/D</span>
          <span><strong>Move</strong> counter/clockwise</span>
          <span><strong>Space</strong> charged catch</span>
          <span><strong>M</strong> menu</span>
          <span><strong>Esc</strong> arcade home</span>
          <span><strong>B</strong> bot fill</span>
        </div>
      </section>
    </main>
    <!-- Terrabyte Arcade HOME overlay (served per-subdomain by the arcade hub; 404s harmlessly in local dev) -->
    <!-- Esc opens the arcade HOME (Wii) overlay; the game binds M for its own menu/pause card. -->
    <script src="/__arcade/home.js" defer></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
